- name: "Proxy" # 通用出口；自动分区组由 preference.yaml 显式配置
  type: select
  proxies:
    - ".*"
    - "DIRECT"

- name: "Apple" # Apple 服务代理
  type: select
  proxies:
    - "DIRECT"
    - "Proxy"
    - ".*"

- name: "GlobalMedia" # 媒体出口手动选择，避免把低延迟当作高吞吐
  type: select
  proxies:
    - ".*"
    - "DIRECT"

- name: "Speedtest" # 测速专用
  type: select
  proxies:
    - "DIRECT"
    - ".*"

- name: "Hijacking" # 运营商及声名狼藉网站劫持
  type: select
  proxies:
    - "REJECT"
    - "DIRECT"
